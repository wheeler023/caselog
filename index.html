<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1033">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Case Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #161718; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #161718; }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          color: #CAD1E6; font: 15px/1.4 -apple-system, Roboto, "Segoe UI", sans-serif; transition: opacity .3s; }
  #wait img { width: 96px; height: 96px; border-radius: 50%; }
  #wait.gone { opacity: 0; pointer-events: none; }
  #help { display: none; text-align: center; max-width: 280px; }
  #help a { color: #FFFFFF; font-weight: 700; display: inline-block; margin-top: 10px; padding: 10px 16px; border: 1.5px solid #FFFFFF; border-radius: 10px; text-decoration: none; }
</style>
</head>
<body>
<div id="wait"><img src="icon-192.png" alt=""><div>Opening your case log…</div>
  <div id="help">Still loading? Google may need you to sign in first.<br><a id="direct" target="_blank" rel="noopener">Sign in to Google</a></div>
</div>
<script>
  // The case log app (Google Apps Script). It runs inside this full-screen frame so the phone shows no address bar.
  var APP = 'https://script.google.com/a/macros/michaelwheelermd.com/s/AKfycbz__2inKJkKl6SlAhsBih4MSkzMCsJrLQAC71UQn_PRQCnEPco7Q_4PGseae0DdCPLz-A/exec';
  document.getElementById('direct').href = APP;
  var f = document.createElement('iframe');
  f.src = APP; f.title = 'Case log'; f.allow = 'clipboard-write';
  f.onload = function () { document.getElementById('wait').className = 'gone'; };
  document.body.appendChild(f);
  setTimeout(function () { document.getElementById('help').style.display = 'block'; }, 9000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
